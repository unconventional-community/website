<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Give a Hand — Concordia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20303D;
    --paper:#EEF0EA;
    --card:#FFFFFF;
    --coral:#E2613B;
    --coral-light:#FBE4DC;
    --mustard:#D9A441;
    --mustard-light:#F8EBD2;
    --sage:#6E8C6B;
    --sage-light:#E3EBE0;
    --text:#2B2B28;
    --muted:#6B6B63;
    --border:#DEDCD0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:'Inter',sans-serif;
  }
  .appbar{
    background:var(--card);
    border-bottom:1px solid var(--border);
  }
  .appbar-inner{
    max-width:920px;
    margin:0 auto;
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logo{
    font-family:'Fraunces',serif;
    font-size:18px;
    font-weight:600;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .logo .mark{
    width:26px;height:26px;border-radius:8px;
    background:var(--coral);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;
  }
  .appbar-right{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .icon-btn{
    background:none;
    border:none;
    font-size:17px;
    color:var(--muted);
    cursor:pointer;
    position:relative;
  }
  .icon-btn .badge{
    position:absolute;
    top:-3px;right:-5px;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--coral);
    border:1.5px solid var(--card);
  }
  .profile-chip{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
  }
  .profile-chip .avatar-big{
    width:32px;height:32px;border-radius:50%;
    background:var(--mustard-light);
    color:#7A5A18;
    font-size:12px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--card);
    box-shadow:0 0 0 1.5px var(--border);
  }
  .profile-chip .pname{
    font-size:13px;
    font-weight:500;
    color:var(--ink);
  }
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:24px 24px 80px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:28px;
  }
  .place{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Fraunces',serif;
    font-size:20px;
    font-weight:600;
    color:var(--ink);
  }
  .place span.sub{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:400;
    color:var(--muted);
    margin-left:4px;
  }
  .tabs{
    display:flex;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:999px;
    padding:4px;
    gap:4px;
  }
  .tab-btn{
    border:none;
    background:transparent;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:500;
    padding:8px 18px;
    border-radius:999px;
    cursor:pointer;
    color:var(--muted);
    transition:background .15s ease, color .15s ease;
  }
  .tab-btn.active{
    background:var(--ink);
    color:#fff;
  }
  .tab-desc{
    font-size:13px;
    color:var(--muted);
    margin:0 0 22px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--coral);
    display:inline-block;
  }

  section{display:none;}
  section.active{display:block;}

  .rail-label{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .rail{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:30px;
  }
  .rail::-webkit-scrollbar{height:6px;}
  .rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    flex:0 0 220px;
    display:flex;
    flex-direction:column;
  }
  .card.wide{
    flex:1 1 auto;
    width:100%;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:16px;
  }
  .thumb{
    position:relative;
    aspect-ratio:16/10;
    width:100%;
    overflow:hidden;
    background:var(--sage-light);
  }
  .thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .pin{
    position:absolute;
    top:10px;
    left:10px;
    background:var(--ink);
    color:#fff;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:500;
    padding:4px 8px;
    border-radius:999px;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .pin.high{background:var(--coral);}
  .creator-flag{
    position:absolute;
    top:10px;
    right:10px;
    background:var(--sage);
    color:#fff;
    font-size:10px;
    font-weight:500;
    padding:4px 8px;
    border-radius:999px;
  }
  .card-body{
    padding:12px 14px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
  }
  .tag{
    align-self:flex-start;
    font-size:11px;
    font-weight:500;
    padding:3px 9px;
    border-radius:6px;
  }
  .tag.wildlife{background:var(--sage-light);color:#3E5A3B;}
  .tag.lost{background:#E1EEF7;color:#1F5B82;}
  .tag.tenant{background:#FBE3E3;color:#9B2C2C;}
  .tag.art{background:#F1E6F7;color:#6A3D85;}
  .tag.general{background:#F0F0EC;color:var(--muted);}
  .tag.civic{background:#FDEBD2;color:#8A5A1E;}
  .tag.building{background:#E3E0F0;color:#4B3D8A;}
  .axis-dot{
    font-size:10px;
    color:var(--muted);
    margin-left:6px;
    font-weight:500;
  }
  .connect-prompt{
    margin:14px 0 0 38px;
    background:var(--sage-light);
    border:1px solid var(--sage);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    max-width:420px;
  }
  .connect-text{font-size:12.5px;color:#3E5A3B;line-height:1.4;flex:1;}
  .connect-btn{
    background:var(--sage);color:#fff;
    font-size:12px;font-weight:500;
    padding:7px 14px;border-radius:8px;
    border:none;cursor:pointer;white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .connect-btn.sent{background:#fff;color:var(--sage);border:1px solid var(--sage);}
  .pin.cluster{background:#8A5A1E;}
  .guide-badge{
    display:inline-flex;align-items:center;gap:4px;
    background:var(--mustard-light);color:#8A5A1E;
    font-size:10px;font-weight:600;
    padding:2px 8px;border-radius:999px;
    margin-left:6px;
  }
  .comment{
    border-top:1px solid var(--border);
    padding:14px 0;
  }
  .comment-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .comment-avatar{
    width:30px;height:30px;border-radius:50%;
    background:var(--sage);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;flex:none;
  }
  .comment-name{font-weight:600;font-size:13px;}
  .comment-time{font-size:11px;color:var(--muted);}
  .comment-text{font-size:13px;line-height:1.5;margin:0 0 10px 38px;}
  .product-card{
    margin-left:38px;
    display:flex;gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    align-items:center;
    max-width:380px;
  }
  .product-card img{
    width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;
  }
  .product-name{font-weight:600;font-size:13px;}
  .product-meta{font-size:11px;color:var(--muted);margin-top:2px;}
  .product-cta{
    margin-left:auto;
    background:var(--ink);color:#fff;
    font-size:11px;font-weight:500;
    padding:6px 10px;border-radius:8px;
    white-space:nowrap;
  }
  .helpful-btn{
    margin:8px 0 0 38px;
    display:inline-flex;align-items:center;gap:6px;
    background:none;
    border:1px solid var(--border);
    border-radius:999px;
    padding:5px 12px;
    font-size:12px;font-weight:500;
    color:var(--muted);
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .helpful-btn:hover{border-color:var(--sage);color:var(--sage);}
  .helpful-btn.marked{background:var(--sage-light);color:#3E5A3B;border-color:var(--sage);}
  .helpful-count{font-weight:600;}
  .tag.labor{background:#DCEAE6;color:#1F6E54;}
  .pin.request{background:#1F6E54;}
  .offer-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    display:flex;
    gap:12px;
  }
  .offer-avatar{
    width:42px;height:42px;border-radius:50%;
    background:#1F6E54;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:600;flex:none;
  }
  .offer-body{flex:1;}
  .offer-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .offer-name{font-weight:600;font-size:13px;}
  .first-job-badge{
    font-size:10px;font-weight:600;color:#8A5A1E;
    background:var(--mustard-light);
    padding:2px 8px;border-radius:999px;
  }
  .trusted-badge{
    font-size:10px;font-weight:600;color:#1F6E54;
    background:#DCEAE6;
    padding:2px 8px;border-radius:999px;
  }
  .business-badge{
    font-size:10px;font-weight:600;color:#20303D;
    background:#DCE3EA;
    padding:2px 8px;border-radius:999px;
  }

  .referral-card{
    border:1px solid var(--sage);background:var(--sage-light);border-radius:14px;
    padding:14px 16px;
  }
  .referral-card.locked{border:1px dashed var(--border);background:var(--paper);}
  .referral-title{font-size:13px;font-weight:600;color:#3E5A3B;}
  .referral-card.locked .referral-title{color:var(--muted);}
  .referral-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;}
  .referral-btn{
    margin-top:10px;font-size:12px;font-weight:600;border-radius:8px;padding:7px 12px;
    border:1px solid var(--sage);background:#fff;color:#3E5A3B;cursor:pointer;
  }
  .referral-btn:hover{background:var(--sage);color:#fff;}
  .referral-btn.pending{color:var(--muted);cursor:default;}
  .referral-btn.paid{background:var(--ink);border-color:var(--ink);color:#fff;cursor:default;}
  .offer-rate{font-size:12px;color:var(--muted);margin-top:2px;}
  .offer-text{font-size:13px;line-height:1.5;margin:8px 0 10px;}
  .offer-actions{display:flex;gap:8px;}
  .offer-msg-btn{
    background:var(--ink);color:#fff;
    font-size:12px;font-weight:500;
    padding:7px 14px;border-radius:8px;
    border:none;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .offer-mutual{font-size:11px;color:var(--muted);}

  .team-suggest{
    background:var(--coral-light);
    border:1px solid var(--coral);
    border-radius:12px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .team-suggest .duo-avatars{display:flex;flex:none;}
  .team-suggest .duo-avatars .mini-avatar{
    width:30px;height:30px;border-radius:50%;
    background:#993C1D;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;
    border:2px solid var(--coral-light);
  }
  .team-suggest .duo-avatars .mini-avatar:last-child{margin-left:-10px;}
  .team-suggest .team-text{flex:1;font-size:12.5px;color:#712B13;line-height:1.4;}
  .team-suggest .team-text b{font-weight:600;}
  .team-btn{
    background:var(--coral);color:#fff;
    font-size:12px;font-weight:500;
    padding:7px 14px;border-radius:8px;
    border:none;cursor:pointer;white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .team-btn.sent{background:#fff;color:var(--coral);border:1px solid var(--coral);}

  .bridge-prompt{
    background:var(--mustard-light);
    border:1px solid var(--mustard);
    border-radius:12px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .bridge-prompt .duo-avatars{display:flex;flex:none;}
  .bridge-prompt .duo-avatars .mini-avatar{
    width:30px;height:30px;border-radius:50%;
    background:#8A5A1E;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;
    border:2px solid var(--mustard-light);
  }
  .bridge-prompt .duo-avatars .mini-avatar:last-child{margin-left:-10px;}
  .bridge-prompt .bridge-text{flex:1;font-size:12.5px;color:#7A5A18;line-height:1.4;}
  .bridge-prompt .bridge-text b{font-weight:600;}
  .bridge-btn{
    background:var(--mustard);color:#fff;
    font-size:12px;font-weight:500;
    padding:7px 14px;border-radius:8px;
    border:none;cursor:pointer;white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .bridge-btn.sent{background:#fff;color:var(--mustard);border:1px solid var(--mustard);}

  .resurface-banner{
    background:var(--sage-light);
    border:1px solid var(--sage);
    border-radius:12px;
    padding:14px;
    margin:18px 0;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .resurface-banner .mini-avatar{
    width:34px;height:34px;border-radius:50%;
    background:var(--sage);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;flex:none;
  }
  .resurface-banner .resurface-text{flex:1;font-size:12.5px;color:#3E5A3B;line-height:1.4;}
  .resurface-banner .resurface-text b{font-weight:600;}
  .resurface-btn{
    background:var(--sage);color:#fff;
    font-size:12px;font-weight:500;
    padding:7px 14px;border-radius:8px;
    border:none;cursor:pointer;white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .resurface-btn.sent{background:#fff;color:var(--sage);border:1px solid var(--sage);}

  .live-rail{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:26px;
  }
  .live-rail::-webkit-scrollbar{height:6px;}
  .live-rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .live-card{
    flex:0 0 92px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    position:relative;
    cursor:pointer;
  }
  .live-avatar-wrap{position:relative;flex:none;margin-bottom:10px;}
  .live-avatar{
    width:60px;height:60px;border-radius:50%;
    background:var(--mustard-light);
    color:#7A5A18;
    font-size:18px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--card);
    box-shadow:0 0 0 1.5px var(--border);
  }
  .live-pulse{
    position:absolute;
    bottom:1px;right:1px;
    width:14px;height:14px;
    border-radius:50%;
    background:var(--sage);
    border:2.5px solid var(--card);
  }

  /* ---- neighbours discovery row (person-first, avatar + name + interest hint) ---- */
  .neighbour-discovery-row{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:26px;
  }
  .neighbour-tile{
    flex:0 0 92px;
    display:flex;flex-direction:column;align-items:center;
    text-align:center;
    cursor:pointer;
  }
  .neighbour-avatar-wrap{position:relative;flex:none;margin-bottom:10px;}
  .neighbour-avatar{
    width:60px;height:60px;border-radius:50%;
    background:var(--mustard-light);
    color:#7A5A18;
    font-size:18px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--card);
    box-shadow:0 0 0 1.5px var(--border);
    transition:transform .15s ease;
  }
  .neighbour-tile:hover .neighbour-avatar{transform:scale(1.05);}
  .neighbour-interest-hint{
    position:absolute;bottom:1px;right:1px;
    width:22px;height:22px;border-radius:50%;
    background:var(--card);
    border:2px solid var(--card);
    box-shadow:0 0 0 1px var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
  }
  .neighbour-tile-name{
    font-size:12px;font-weight:600;color:var(--text);
    line-height:1.3;
  }
  .live-pulse::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:var(--sage);
    animation:live-pulse-ring 1.8s ease-out infinite;
  }
  @keyframes live-pulse-ring{
    0%{transform:scale(1);opacity:.7;}
    100%{transform:scale(2.4);opacity:0;}
  }
  .live-name{font-size:12.5px;font-weight:600;color:var(--ink);}
  .live-activity{
    font-size:11.5px;color:var(--muted);margin-top:3px;
    display:flex;align-items:center;justify-content:center;gap:4px;
    white-space:nowrap;
  }
  .live-status-badge{
    display:none;
    font-size:10.5px;
    font-weight:600;
    padding:3px 9px;
    border-radius:999px;
    margin-top:8px;
  }
  .live-status-badge.show{display:inline-flex;align-items:center;gap:4px;}
  .live-status-badge.pending{
    background:var(--mustard-light);
    color:#8A5A1E;
  }
  .live-status-badge.unlocked{
    background:var(--sage-light);
    color:#3E5A3B;
    border:1px solid var(--sage);
  }
  .live-card.has-status .live-avatar{box-shadow:0 0 0 2px var(--sage);}
  .live-visible-location{
    display:none;
    font-size:10.5px;
    font-family:'JetBrains Mono',monospace;
    color:#3E5A3B;
    background:var(--sage-light);
    border:1px solid var(--sage);
    border-radius:8px;
    padding:5px 7px;
    margin-top:8px;
    line-height:1.3;
  }
  .live-visible-location.show{display:block;}
  .live-avatar-wrap,.live-name{cursor:pointer;}
  .live-join-btn{
    margin:0;
    background:var(--sage);color:#fff;
    font-size:11.5px;font-weight:500;
    padding:7px 10px;border-radius:8px;
    border:none;cursor:pointer;
    font-family:'Inter',sans-serif;
    width:100%;
  }
  .live-join-btn.pending{
    background:var(--mustard-light);color:#8A5A1E;
    cursor:default;
  }
  .live-join-btn.unlocked{
    background:var(--sage-light);color:#3E5A3B;
    border:1px solid var(--sage);
  }
  /* The join button floats on its own layer above everything else, positioned via JS to
     the hovered card's location — like Roblox's "join" affordance, it's not part of the
     roster row's own layout, so the row of cards never stretches or scrolls to fit it,
     and it's free to overlap neighbouring sections below the rail. */
  .live-hover-tooltip{
    position:fixed;
    display:none;
    padding:4px;
    z-index:60;
  }
  .live-hover-tooltip.show{display:block;}

  .live-card.offline{cursor:pointer;}
  .live-card.offline .live-avatar{
    background:var(--paper);
    color:var(--muted);
    box-shadow:0 0 0 1.5px var(--border);
  }
  .live-card.offline .live-activity{color:var(--muted);}

  .continue-rail{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:26px;
  }
  .continue-rail::-webkit-scrollbar{height:6px;}
  .continue-rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .continue-card{
    flex:0 0 202px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    transition:transform .12s ease;
  }
  .continue-card:hover{transform:translateY(-2px);}
  .continue-card img{

/* ---- phase 1 additions (everything else is the phase 5 stylesheet, unchanged) ---- */
.brand{font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:var(--ink);text-decoration:none}
.note{border-radius:10px;padding:10px 14px;font-size:13px;margin:0 0 14px}
.note.err{background:#FBE4DC;color:#9C3A1C}.note.ok{background:var(--sage-light);color:#3E5A3B}.note.demo{background:#F8EBD2;color:#7A5A18;border:1px solid #E8D3A3}
.hero{text-align:center;padding:28px 8px 10px;max-width:560px;margin:0 auto}.hero h1{font-family:'Fraunces',serif;font-size:34px;margin:0 0 8px;color:var(--ink)}.hero p{color:var(--muted);margin:0 0 6px}
.card-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin:14px auto;max-width:560px}
.card-box.wide-box{max-width:none;margin:0}
.card-box label,.prof-body label{display:block;font-size:12.5px;font-weight:600;margin:14px 0 5px;color:var(--ink)}
.card-box label:first-child{margin-top:0}
.card-box input,.card-box select,.card-box textarea,.prof-body input,.prof-body textarea,.card-box .prev{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--paper);color:var(--text)}
.card-box textarea,.prof-body textarea{min-height:78px;resize:vertical}
.card-box input[type=file]{padding:8px;background:#fff}
.card-box img.prev{padding:0;max-height:180px;object-fit:cover;margin-top:8px}
.form-h{font-family:'Fraunces',serif;font-size:22px;margin:0 0 4px;color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.hint-line{font-size:12.5px;color:var(--muted)}
.post-btn.wide{width:100%;margin-top:14px;padding:11px 18px}.post-btn.sm,.ghost-btn.sm{font-size:12.5px;padding:7px 14px}
.post-btn:disabled,.ghost-btn:disabled{opacity:.55;cursor:default}
.ghost-btn{background:#fff;color:var(--ink);border:1px solid var(--border);border-radius:999px;font:inherit;font-size:13px;font-weight:500;padding:8px 18px;cursor:pointer}
.topic-fill{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px}
.topic-fill span{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:#2F3B33;opacity:.82;line-height:1.2}
.topic-fill.big span{font-size:28px}
.post-hero img{width:100%;height:100%;object-fit:cover}
.row-av{width:64px;height:64px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:20px;color:#3A463D;overflow:hidden}
.row-av img{width:100%;height:100%;object-fit:cover}
.row-tags{display:flex;align-items:center;gap:10px;margin-top:6px}.row-offers{font-size:12px;color:var(--muted)}
.tag.over{background:#F8EBD2;color:#7A5A18;display:inline-block}
.list{display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}.empty.small{padding:16px 10px;background:var(--card);border:1px dashed var(--border);border-radius:12px;font-size:13px}
.rail-sub{font-size:12px;color:var(--muted);margin:-6px 0 14px}
.stack{display:flex;flex-direction:column;gap:10px}
.offer-main{flex:1;min-width:0}.offer-note{font-size:13px;color:var(--text);margin:4px 0 8px}
.offer-card .row-top{flex-wrap:wrap}.offer-card .row-time{margin-left:auto}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.status{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.status.wait{background:#F8EBD2;color:#7A5A18}.status.ok{background:var(--sage-light);color:#3E5A3B}.status.no{background:#EEE;color:var(--muted)}
.contact{background:var(--sage-light);border-radius:10px;padding:8px 12px;font-size:13.5px;margin-top:8px}
.review{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}.review input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font:inherit;font-size:13.5px}
.star-in button{background:none;border:0;font-size:26px;cursor:pointer;color:#CFCFC6;padding:0 2px}.star-in button.on{color:var(--mustard)}
.stars{color:var(--mustard);letter-spacing:1px}.muted-s{color:var(--muted);font-size:12px}
.prof-body{padding:18px 0}.prof-tabs{margin:16px 0 0}.prof-tabs .tab{cursor:pointer}.prof-tabs .tab.active{color:var(--ink);border-bottom-color:var(--ink)}

.sess{display:flex;flex-direction:column;gap:6px}.sess-link{font-size:12.5px;color:var(--muted);cursor:pointer}
.appbar-inner{display:flex;align-items:center;max-width:920px;margin:0 auto;padding:10px 24px}
.back-btn{background:none;border:0;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;padding:0}
@media(max-width:640px){.post-top-row{grid-template-columns:1fr}.wrap{padding:16px 16px 80px}.appbar-inner{padding:10px 16px}.topbar{flex-direction:column;align-items:flex-start;gap:12px}.header{margin:0 -16px}}

.composer-top .avatar-big,.post-author .avatar-big{width:34px;height:34px;border-radius:50%;background:var(--mustard-light);color:#7A5A18;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
#profile-page .avatar-lg{font-size:26px}
#profile-page .head-row{align-items:flex-start;flex-wrap:wrap}
#profile-page .prof-tabs{border-radius:0;border:0;background:none;padding:0;gap:0;margin:14px 0 0}
#profile-page .prof-tabs .tab{border-bottom:2px solid transparent}

  /* status: soft pill editor, no boxes */
  .st-label{background:none;border:0;padding:2px 6px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;max-width:130px;white-space:normal;overflow-wrap:anywhere;text-align:center;line-height:1.3;border-radius:12px;transition:background .15s}
  .st-label:hover{background:var(--paper);color:var(--ink)}
  .st-label.add{color:var(--sage);font-weight:600}
  .st-pill{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--border);border-radius:999px;padding:4px 5px 4px 4px;transition:border-color .15s,box-shadow .15s}

  .st-emoji{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);box-shadow:0 0 0 1px var(--border);font-size:19px;cursor:pointer;flex:none;padding:0;transition:transform .12s}

  .st-input{flex:1;min-width:0;border:0!important;background:transparent!important;box-shadow:none!important;outline:none;font:inherit;font-size:14px;color:var(--ink);padding:6px 4px;margin:0!important}
  .st-share{border:0;border-radius:999px;background:var(--sage);color:#fff;font:inherit;font-size:13px;font-weight:600;padding:8px 16px;cursor:pointer;flex:none}

<body>
<div class="appbar" id="appbar"></div>
<div class="wrap" id="root"><div class="empty">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ============ CONFIG — paste your Supabase values (see SETUP.md). Leave empty for demo mode. ============ */
var SUPABASE_URL = "";
var SUPABASE_ANON_KEY = "";
var SPACE_SLUG = "concordia";           // phase 5: a neighbourhood space, e.g. "plateau"
/* ==========================================================================================
   PHASE FLAGS — this is the same app as phase 5, with most lanes switched off.
   To move to the next phase you flip flags and add the matching modules; nothing is rebuilt.
   ========================================================================================== */
var FEATURES = {
  helpLane:true,        // phase 1 — "🤝 Looking for help" posts + offers + sessions + reviews
  connections:false,    // phase 2 — Connections row ("online now"), neighbour profiles, mutual connections
  topicHubs:false,      // phase 3 — Topic hubs: field guide / growth plots / creations (wildlife, art, garden…)
  maps:false,           // phase 4 — Map + location (permission based, spaces get coordinates)
  forYouRanking:false   // phase 5 — full three-lane "For you" (popular + matches + test exposure)
};
var DEMO = !SUPABASE_URL || !SUPABASE_ANON_KEY || (location.search.indexOf('demo=1') > -1);

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(c){return '$'+(c/100).toFixed(c%100===0?0:2);}
function initials(n){return (n||'?').split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
function first(n){return (n||'').split(/\s+/)[0];}
function ago(iso){var s=(Date.now()-new Date(iso).getTime())/1000; if(s<3600)return Math.max(1,Math.round(s/60))+'m'; if(s<86400)return Math.round(s/3600)+'h'; return Math.round(s/86400)+'d';}
function agoLong(iso){var a=ago(iso),n=parseInt(a,10); return a.slice(-1)==='m'?n+' min ago':a.slice(-1)==='h'?n+'h ago':n+(n===1?' day ago':' days ago');}
function hash(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
var GRAD=[['#E3EBE0','#C9DCC4'],['#F8EBD2','#EBCF9A'],['#DCEAE6','#B4D3C9'],['#FBE4DC','#F0BBA8'],['#E5E3F2','#BDB8DF'],['#E4EDF4','#B5CDE0']];
function thumbStyle(topic){var g=GRAD[hash(topic)%GRAD.length];return 'background:linear-gradient(135deg,'+g[0]+','+g[1]+')';}
function thumbHtml(r,pin,pinCls){
  return '<div class="thumb">'+(r.image?'<img src="'+r.image+'" alt="">':'<div class="topic-fill" style="'+thumbStyle(r.topic)+'"><span>'+esc(r.topic)+'</span></div>')+
    (pin?'<span class="pin '+(pinCls||'request')+'">'+esc(pin)+'</span>':'')+'</div>';
}
function stars(avg,n){if(!n)return '<span class="muted-s">New helper</span>';var r=Math.round(avg);return '<span class="stars">'+'★'.repeat(r)+'☆'.repeat(5-r)+'</span> <span class="muted-s">'+avg.toFixed(1)+' ('+n+')</span>';}

/* ===================== DATA LAYER =====================
   The UI only talks to `api`. Two implementations: Supabase (live) and a localStorage demo. */
var api;
function makeSupabaseApi(){
  var sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY), spaceId=null, uid=null;
  function chk(r){ if(r.error) throw new Error(r.error.message); return r.data; }
  function reqShape(r){ return {id:r.id,topic_id:r.topic_id,topic:r.topics.name,title:r.title,details:r.details,budget_cents:r.budget_cents,image:r.image,status:r.status,offers_count:r.offers_count,created_at:r.created_at,requester_id:r.requester_id,requester_name:r.profiles?r.profiles.display_name:'Neighbour'}; }
  return {
    live:true,
    onAuth:function(cb){ sb.auth.onAuthStateChange(function(){cb();}); },
    session:async function(){ var s=chk(await sb.auth.getSession()).session; uid=s?s.user.id:null; return s?{id:s.user.id,email:s.user.email}:null; },
    signIn:async function(email){ chk(await sb.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.href.split('#')[0].split('?')[0]}})); },
    signOut:async function(){ await sb.auth.signOut(); },
    me:async function(){
      var sp=chk(await sb.from('spaces').select('*').eq('slug',SPACE_SLUG).single()); spaceId=sp.id;
      var p=(await sb.from('profiles').select('*').eq('id',uid).maybeSingle()).data; if(!p) return null;
      var c=(await sb.from('contacts').select('contact').eq('profile_id',uid).maybeSingle()).data;
      return {id:p.id,name:p.display_name,bio:p.bio,contact:c?c.contact:'',space:sp};
    },
    saveProfile:async function(f){
      chk(await sb.from('profiles').upsert({id:uid,space_id:spaceId,display_name:f.name,bio:f.bio}));
      chk(await sb.from('contacts').upsert({profile_id:uid,contact:f.contact}));
    },
    topics:async function(){ return chk(await sb.from('topics').select('*').order('name')); },
    ensureTopic:async function(name){
      name=name.trim(); var t=(await sb.from('topics').select('*').ilike('name',name.replace(/[%_]/g,'\\$&'))).data;
      if(t&&t.length) return t[0];
      return chk(await sb.from('topics').insert({space_id:spaceId,name:name}).select().single());
    },
    myServices:async function(){ return chk(await sb.from('services').select('*, topics(name)').eq('profile_id',uid)); },
    saveService:async function(f){ var t=await this.ensureTopic(f.topic); chk(await sb.from('services').upsert({profile_id:uid,topic_id:t.id,price_cents:f.price_cents,note:f.note,active:true},{onConflict:'profile_id,topic_id'})); },
    deleteService:async function(id){ chk(await sb.from('services').delete().eq('id',id)); },
    myRatings:async function(){ var r=chk(await sb.from('reviews').select('rating,comment,created_at').eq('helper_id',uid)); return r; },
    findHelpers:async function(topicId){
      var sv=chk(await sb.from('services').select('*, profiles(id,display_name,bio)').eq('topic_id',topicId).eq('active',true)).filter(function(s){return s.profile_id!==uid;});
      var ids=sv.map(function(s){return s.profile_id;});
      var rv=ids.length?chk(await sb.from('reviews').select('helper_id,rating').in('helper_id',ids)):[];
      return sv.map(function(s){ var m=rv.filter(function(r){return r.helper_id===s.profile_id;});
        return {id:s.profile_id,name:s.profiles.display_name,bio:s.profiles.bio,price_cents:s.price_cents,note:s.note,n:m.length,sum:m.reduce(function(a,r){return a+r.rating;},0)}; });
    },
    feed:async function(){ return chk(await sb.from('requests').select('*, topics(name), profiles!requests_requester_id_fkey(display_name)').neq('status','closed').order('created_at',{ascending:false}).limit(100)).map(reqShape); },
    getRequest:async function(id){ return reqShape(chk(await sb.from('requests').select('*, topics(name), profiles!requests_requester_id_fkey(display_name)').eq('id',id).single())); },
    createRequest:async function(f){ return chk(await sb.from('requests').insert({space_id:spaceId,requester_id:uid,topic_id:f.topic_id,title:f.title,details:f.details,budget_cents:f.budget_cents,image:f.image||null}).select().single()); },
    closeRequest:async function(id){ chk(await sb.from('requests').update({status:'closed'}).eq('id',id)); },
    bookings:async function(){
      var rows=chk(await sb.from('bookings').select('*, requests(title,details,topics(name)), req:profiles!bookings_requester_id_fkey(id,display_name), hlp:profiles!bookings_helper_id_fkey(id,display_name)').or('requester_id.eq.'+uid+',helper_id.eq.'+uid).order('created_at',{ascending:false}));
      var rv=rows.length?chk(await sb.from('reviews').select('booking_id')):[]; var out=[];
      for(var i=0;i<rows.length;i++){ var b=rows[i], mineReq=b.requester_id===uid, other=mineReq?b.hlp:b.req, contact='';
        if(b.status==='accepted'||b.status==='completed'){ var c=(await sb.from('contacts').select('contact').eq('profile_id',other.id).maybeSingle()).data; contact=c?c.contact:''; }
        out.push({id:b.id,request_id:b.request_id,role:mineReq?'requester':'helper',initiator:b.initiator,status:b.status,price_cents:b.price_cents,note:b.note,requester_paid:b.requester_paid,helper_received:b.helper_received,
          title:b.requests.title,topic:b.requests.topics.name,other_id:other.id,other_name:other.display_name,contact:contact,created_at:b.created_at,
          reviewed:rv.some(function(r){return r.booking_id===b.id;})}); }
      return out;
    },
    ask:async function(requestId,helperId,price){ chk(await sb.from('bookings').insert({request_id:requestId,requester_id:uid,helper_id:helperId,initiator:'requester',price_cents:price})); },
    offer:async function(requestId,requesterId,price,note){ chk(await sb.from('bookings').insert({request_id:requestId,requester_id:requesterId,helper_id:uid,initiator:'helper',price_cents:price,note:note})); },
    setBooking:async function(id,patch,requestId,reopen){ chk(await sb.from('bookings').update(patch).eq('id',id)); /* reopen handled by the bookings_sync trigger (see decline-anytime.sql) */ },
    people:async function(){ var ps=chk(await sb.from('profiles').select('id,display_name,bio').neq('id',uid)), st=chk(await sb.from('statuses').select('profile_id,emoji,text')); /* RLS only returns visible, fresh ones */
      return ps.map(function(p){var x=st.filter(function(r){return r.profile_id===p.id;})[0];return {id:p.id,name:p.display_name,bio:p.bio,status:x?((x.emoji+' '+x.text).trim()):'',emoji:x?x.emoji:'',stext:x?x.text:''};}); },
    myStatus:async function(){ var r=(await sb.from('statuses').select('*').eq('profile_id',uid).maybeSingle()).data; return r?{emoji:r.emoji,text:r.text,visible:r.visible,at:Date.parse(r.updated_at)}:{emoji:'',text:'',visible:false,at:0}; },
    setStatus:async function(emoji,text,visible){ chk(await sb.from('statuses').upsert({profile_id:uid,emoji:emoji,text:text,visible:visible})); },
    conns:async function(){
      var rows=chk(await sb.from('connections').select('*, f:profiles!connections_from_id_fkey(id,display_name), t:profiles!connections_to_id_fkey(id,display_name)').or('from_id.eq.'+uid+',to_id.eq.'+uid).order('created_at',{ascending:false}));
      return rows.map(function(c){var out=c.from_id===uid,o=out?c.t:c.f;return {id:c.id,dir:out?'out':'in',status:c.status,place:c.place,other_id:o.id,other_name:o.display_name};}); },
    connect:async function(toId){ chk(await sb.from('connections').insert({from_id:uid,to_id:toId})); },
    setConn:async function(id,patch){ chk(await sb.from('connections').update(patch).eq('id',id)); },
    cancelConn:async function(id){ chk(await sb.from('connections').delete().eq('id',id)); },
    sightings:async function(since){ var q=sb.from('sightings').select('*, p:profiles(display_name)').order('created_at',{ascending:false}).limit(500); if(since) q=q.gt('created_at',since);
      return chk(await q).map(function(r){return {id:r.id,user_id:r.user_id,user_name:r.p?r.p.display_name:'',category:r.category,species:r.species,emoji:r.emoji,count:r.count,note:r.note,place:r.place,lat:r.lat,lng:r.lng,seen_at:r.seen_at,created_at:r.created_at};}); },
    addSighting:async function(r){ chk(await sb.from('sightings').insert({user_id:uid,category:r.category,species:r.species,emoji:r.emoji,count:r.count,note:r.note,place:r.place,lat:r.lat,lng:r.lng})); },
    logMap:async function(kind,detail,bytes){ try{ await sb.from('map_events').insert({user_id:uid,kind:kind,detail:detail||'',bytes:bytes||null}); }catch(e){} },
    review:async function(bookingId,helperId,rating,comment){ chk(await sb.from('reviews').insert({booking_id:bookingId,reviewer_id:uid,helper_id:helperId,rating:rating,comment:comment})); }
  };
}

function makeDemoApi(){
  var KEY='gah_demo_v2', d=load();
  function load(){ var s=localStorage.getItem(KEY); return s?JSON.parse(s):seed(); }
  function save(){ localStorage.setItem(KEY,JSON.stringify(d)); }
  function uid(){ return 'd'+Math.random().toString(36).slice(2,10); }
  function seed(){
    var topics=['Illustration','Web development','Video editing','Music production','Writing & editing','Photography','Startup / business plan','3D & game design'].map(function(n,i){return {id:'t'+i,name:n};});
    var profiles=[
      {id:'h1',name:'Amira Benali',bio:'4th-year design student, freelance illustrator for 3 years.',contact:'amira@example.com'},
      {id:'h2',name:'Jonas Keller',bio:'Full-stack dev, TA for web courses. Patient with beginners.',contact:'jonas@example.com'},
      {id:'h3',name:'Léa Martin',bio:'Film-school grad. Premiere, DaVinci, sound mixing.',contact:'lea@example.com'},
      {id:'h4',name:'Tariq Saleh',bio:'Producer, Ableton + mixing. Played in 3 bands.',contact:'tariq@example.com'},
      {id:'h5',name:'Mei Lin',bio:'MBA candidate, helped 12 student startups with pitch decks.',contact:'mei@example.com'},
      {id:'n1',name:'Priya Nair',bio:'',contact:''},{id:'n2',name:'Omar Haddad',bio:'',contact:''},{id:'n3',name:'Chloé Roy',bio:'',contact:''},{id:'n4',name:'Dan Ferreira',bio:'',contact:''}];
    var services=[
      {id:'s1',profile_id:'h1',topic_id:'t0',price_cents:2000,note:'Digital + traditional. Character design, portfolios.'},
      {id:'s2',profile_id:'h2',topic_id:'t1',price_cents:2500,note:'HTML/CSS/JS, React, debugging your project.'},
      {id:'s3',profile_id:'h3',topic_id:'t2',price_cents:2200,note:'Editing, colour, sound.'},
      {id:'s4',profile_id:'h4',topic_id:'t3',price_cents:1800,note:'Arrangement, mixing, getting unstuck.'},
      {id:'s5',profile_id:'h5',topic_id:'t6',price_cents:3000,note:'Pitch decks, business model, first customers.'},
      {id:'s6',profile_id:'h2',topic_id:'t7',price_cents:2500,note:'Unity basics.'},
      {id:'s7',profile_id:'h3',topic_id:'t5',price_cents:2000,note:'Portraits, editing in Lightroom.'}];
    var reviews=[{booking_id:'x1',helper_id:'h1',rating:5},{booking_id:'x2',helper_id:'h1',rating:5},{booking_id:'x3',helper_id:'h2',rating:4},{booking_id:'x4',helper_id:'h5',rating:5},{booking_id:'x5',helper_id:'h3',rating:5}];
    var now=Date.now(), H=3600000;
    function rq(id,rid,t,title,details,b,hrs,offers){return {id:id,requester_id:rid,topic_id:t,title:title,details:details,budget_cents:b,image:null,status:'open',offers_count:offers,created_at:new Date(now-hrs*H).toISOString()};}
    var requests=[
      rq('r1','n1','t2','Need a second pair of eyes on the rough cut of my short film','Three-minute piece, pacing feels off in the middle. Premiere Pro.',2500,3,2),
      rq('r2','n2','t1','Landing page for my startup keeps breaking on mobile','Flexbox layout, nav overlaps under 400px.',3000,9,1),
      rq('r3','n3','t0','Feedback on my illustration portfolio before applications','8 pieces, unsure about the order and which to cut.',2000,26,0),
      rq('r4','n4','t3','My mix sounds muddy — help with low end?','Ableton, bedroom recording, lots of bass.',2000,50,3)];
    d={me:null,topics:topics,profiles:profiles,services:services,requests:requests,bookings:[],reviews:reviews};
    save(); return d;
  }
  function prof(id){return d.profiles.filter(function(p){return p.id===id;})[0];}
  function top(id){return d.topics.filter(function(t){return t.id===id;})[0];}
  function reqShape(r){return Object.assign({},r,{topic:top(r.topic_id).name,requester_name:prof(r.requester_id).name});}
  function ping(){ window.softRefresh&&window.softRefresh(); }
  return {
    live:false,
    onAuth:function(){},
    session:async function(){return d.me?{id:'me',email:d.me.email}:null;},
    signIn:async function(email){d.me={email:email,profile:null};save();},
    signOut:async function(){localStorage.removeItem(KEY);seed();},
    me:async function(){return d.me&&d.me.profile?d.me.profile:null;},
    saveProfile:async function(f){d.me.profile={id:'me',name:f.name,bio:f.bio,contact:f.contact,space:{name:'Concordia University'}};d.profiles=d.profiles.filter(function(p){return p.id!=='me';});d.profiles.push({id:'me',name:f.name,bio:f.bio,contact:f.contact});save();},

/* ===================== MATCHING (auto — nobody matches by hand) =====================
   Budget fit first, then rating (with a prior so one 5★ doesn't beat ten 4.8s), then price. */
function rankHelpers(list,budget){
  list.forEach(function(h){h.score=(h.sum+4*2)/(h.n+2);h.avg=h.n?h.sum/h.n:0;h.fits=h.price_cents<=budget;});
  return list.sort(function(a,b){if(a.fits!==b.fits)return a.fits?-1:1;if(b.score!==a.score)return b.score-a.score;return a.price_cents-b.price_cents;});
}

function prepMap(){

    var had=false;try{had=!!localStorage.getItem('gah_map_dl');}catch(e){}

async function downloadMap(){
  if(mapState.dlP&&!mapState.dlErr)return mapState.dlP; mapState.dlErr=''; render();
  mapState.dlP=(async function(){
    try{ var r=await fetch(MAP_URL,{cache:'no-cache'}); if(!r.ok)throw new Error('Map download failed ('+r.status+')');
      var blob=await r.blob();
      try{ await idbSet('montreal',{v:MAP_VERSION,blob:blob}); localStorage.setItem('gah_map_dl','1'); if(navigator.storage&&navigator.storage.persist)navigator.storage.persist(); }catch(e){}
      api.logMap('downloaded','',blob.size); mapState.saved=true;   /* the map on screen keeps streaming; next visit opens from this saved copy */

  } else {

    h+='<p class="rail-label">📅 Sessions & offers</p><div class="stack">'+(items.map(function(b){return '<div class="sess"><a class="sess-link" data-go="post/'+b.request_id+'"><span class="tag labor">'+esc(b.topic)+'</span> '+esc(b.title)+'</a>'+offerCard(b)+'</div>';}).join('')||'<div class="empty small">No sessions yet.</div>')+'</div>';
  }
  root.innerHTML=h+'</div></div>';
}

async function loadAll(){
  S.topics=await api.topics(); S.services=await api.myServices(); S.feed=await api.feed(); S.bookings=await api.bookings(); S.ratings=await api.myRatings(); S.my=await api.myStatus(); S.conns=await api.conns(); S.people=await api.people(); S.sights=await syncSights();
  var mine=S.feed.filter(function(r){return r.requester_id===S.me.id;});
  for(var i=0;i<mine.length;i++){ S.matches[mine[i].id]=rankHelpers(await api.findHelpers(mine[i].topic_id),mine[i].budget_cents); }
  var rt=route(); if(rt.v==='post'){ try{S.page.req=await api.getRequest(rt.id);}catch(e){S.page.req=null;} 
    if(S.page.req&&!S.matches[rt.id]&&S.page.req.requester_id===S.me.id) S.matches[rt.id]=rankHelpers(await api.findHelpers(S.page.req.topic_id),S.page.req.budget_cents); }
}
function render(){
  if(!S.session){appbar();return viewAuth();}
  if(!S.me){appbar();return viewSetup();}
  appbar(); var rt=route(), y=window.scrollY, fid=document.activeElement&&document.activeElement.id, fv=document.activeElement&&document.activeElement.value;
  if(rt.v==='post')viewPost(rt.id);else if(rt.v==='me')viewMe();else if(rt.v==='new')viewNew();else if(rt.v==='guide')viewGuide(rt.t);else if(rt.v==='trail')viewTrail(rt.id);else if(rt.v==='spot')viewSpot(rt.t);else viewFeed();
  if(fid&&document.getElementById(fid)&&document.activeElement.tagName!=='SELECT'&&document.getElementById(fid).type!=='file'){var f=document.getElementById(fid);f.focus();if(fv!=null)f.value=fv;}
  fitConnRail(); mountMap(); window.scrollTo(0,y);
}
async function refresh(){ if(!S.me)return; try{await loadAll();}catch(e){S.err=e.message;} render(); }
function typing(){var a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');}
window.softRefresh=function(){ if(S.me&&!typing()) refresh(); };
async function start(){
  try{ S.session=await api.session(); S.me=S.session?await api.me():null; if(S.me)await loadAll(); }catch(e){S.err=e.message;}
  render(); if(S.me) prepMap();
}
window.addEventListener('hashchange',function(){S.tstop=null;S.err='';S.ok='';S.page={};S.newImage=null;refresh();window.scrollTo(0,0);});

function dollars(id){return Math.round(parseFloat($(id).value||'0')*100);}
function resizeImage(file,cb){
  var rd=new FileReader(); rd.onload=function(){var im=new Image(); im.onload=function(){var m=520,w=im.width,h=im.height,k=Math.min(1,m/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.72));}; im.src=rd.result;}; rd.readAsDataURL(file);
}
document.addEventListener('change',function(e){
  if(e.target.id==='rtopic'){$('#rtopicnew').style.display=e.target.value==='__new'?'block':'none';}
  if(e.target.id==='rphoto'&&e.target.files[0]){resizeImage(e.target.files[0],function(u){S.newImage=u;var p=$('.prev');if(!p){p=document.createElement('img');p.className='prev';e.target.insertAdjacentElement('afterend',p);}p.src=u;});}
});
document.addEventListener('click',async function(e){
  var t=e.target.closest('[data-go],[data-act],[data-tab],[data-ptab]'); if(!t)return;
  if(t.hasAttribute('data-go')){ e.preventDefault(); if(t.dataset.ptab)S.ptab=t.dataset.ptab; var g=t.dataset.go; S.err='';S.ok=''; if(location.hash.replace(/^#\/?/,'')===g){refresh();}else{location.hash=g?('#/'+g):'#/';} return; }
  if(t.dataset.tab){S.tab=t.dataset.tab;return render();}
  if(t.dataset.ptab&&!t.dataset.act){S.ptab=t.dataset.ptab;S.err='';S.ok='';return render();}
  var a=t.dataset.act; if(!a)return; e.preventDefault(); S.err='';S.ok='';
  try{
    if(a==='signin'){var em=($('#email').value||'').trim();if(!/^\S+@\S+\.\S+$/.test(em))throw new Error('Enter a valid email.');t.disabled=true;await api.signIn(em);if(!api.live)return start();flash('ok','Check your inbox — we sent a sign-in link to '+em+'.');return render();}
    if(a==='signout'){await api.signOut();S.session=null;S.me=null;location.hash='';return start();}
    if(a==='saveprofile'){var f={name:$('#pname').value.trim(),bio:$('#pbio').value.trim(),contact:$('#pcontact').value.trim()};if(!f.name||!f.contact)throw new Error('Add your name and a way to reach you.');
      await api.saveProfile(f);S.me=await api.me();flash('ok','Saved.');return refresh();}
    if(a==='postreq'){var tid=$('#rtopic').value,title=$('#rtitle').value.trim();
      if(tid==='__new'){var nm=$('#rtopicnew').value.trim();if(!nm)throw new Error('Name the topic.');tid=(await api.ensureTopic(nm)).id;}
      if(!tid||!title)throw new Error('Pick a topic and describe your project in one line.');
      var r=await api.createRequest({topic_id:tid,title:title,details:$('#rdetails').value.trim(),budget_cents:dollars('#rbudget'),image:S.newImage});S.newImage=null;S.tab='foryou';
      flash('ok','Request posted — your best matches are below.');location.hash='#/post/'+r.id;return;}
    if(a==='ask'){await api.ask(t.dataset.req,t.dataset.helper,parseInt(t.dataset.price,10));flash('ok','Request sent. We\'ll show the next best match if they decline.');return refresh();}
    if(a==='offer'){var price=dollars('#oprice');await api.offer(t.dataset.req,t.dataset.to,price,($('#onote').value||'').trim());flash('ok','Offer sent.');return refresh();}
    if(a==='accept'){await api.setBooking(t.dataset.id,{status:'accepted'},t.dataset.req);flash('ok','Accepted — their contact is shown below.');return refresh();}
    if(a==='decline'){S.cc=null;await api.setBooking(t.dataset.id,{status:'declined'},t.dataset.req,t.dataset.reopen==='1');flash('ok',t.dataset.reopen==='1'?'Cancelled. Contact hidden, request reopened.':'Done.');return refresh();}
    if(a==='cnav'){var el=document.getElementById('conn-rail');if(el)el.scrollBy({left:parseInt(t.dataset.dir,10)*Math.max(1,Math.floor((el.clientWidth+CONN_GAP)/CONN_STEP))*CONN_STEP,behavior:'smooth'});return;}
    if(a==='sedit'){S.editStatus=!S.editStatus;S.emojiOpen=false;S.draftEmoji=S.draftText=null;return render();}
    if(a==='epick'||a==='eset'){var tb=$('#stext');if(tb)S.draftText=tb.value;if(a==='eset'){S.draftEmoji=t.dataset.e;S.emojiOpen=false;}else S.emojiOpen=!S.emojiOpen;return render();}
    if(a==='ssave'){var tx=($('#stext').value||'').trim(),em=(curEmoji()||'').trim();
      if(!tx&&!em)throw new Error('Add an emoji or a few words first.');
      await api.setStatus(em,tx,true);S.draftEmoji=S.draftText=null;S.emojiOpen=false;S.editStatus=false;return refresh();}
    if(a==='sclear'){await api.setStatus('','',false);S.draftEmoji=S.draftText=null;S.emojiOpen=false;S.editStatus=false;return refresh();}
    if(a==='connect'){await api.connect(t.dataset.to);flash('ok','Request sent.');return refresh();}
    if(a==='cappr'){var pl=($('#place-'+t.dataset.id).value||'').trim();if(!pl)throw new Error('Say where you would meet.');await api.setConn(t.dataset.id,{status:'approved',place:pl});flash('ok','Approved. They can now see the place.');return refresh();}
    if(a==='cdecl'){await api.setConn(t.dataset.id,{status:'declined'});return refresh();}
    if(a==='cask'){S.cc=t.dataset.id;return render();}
    if(a==='ckeep'){S.cc=null;return render();}
    if(a==='ccancel'){S.cc=null;await api.cancelConn(t.dataset.id);flash('ok','Cancelled.');return refresh();}
    if(a==='pinsel'){S.spNote='';S.pin=t.dataset.id;return render();}
    if(a==='guide'){S.guideOpen=true;return render();}
    if(a==='guideclose'){S.guideOpen=false;return render();}
    if(a==='tstop'){S.tstop=+t.dataset.i; var tt=trailBy(route().id),sx=tt&&tt.stops[S.tstop]; if(sx&&mapState.map)mapState.map.flyTo({center:sx.ll,zoom:16}); return render();}
    if(a==='tstopclear'){S.tstop=null;return render();}
    if(a==='pinclear'){S.pin=null;return render();}
    if(a==='spfilter'){ var nm=t.dataset.name; S.guideOpen=false; S.spFocus=nm||null; S.spNote='';
      if(nm){ var rows=spRows('wildlife').filter(function(r){return r.species===nm&&r.lat!=null;}).sort(function(x,y){return new Date(y.seen_at)-new Date(x.seen_at);});
        if(!rows.length){S.pin=null;S.spNote='No pin for '+nm+' yet';}
        else{ S.spCycle=S.spCycle||{}; var k=(S.spCycle[nm]==null?0:S.spCycle[nm]+1)%rows.length; S.spCycle[nm]=k; var pr=rows[k]; S.pin=pr.id;
          if(mapState.map)mapState.map.flyTo({center:[pr.lng,pr.lat],zoom:15}); if(rows.length>1)S.spNote=nm+' · '+(k+1)+' of '+rows.length+' — tap again for the next'; } }
      else S.pin=null;
      return render();}
    if(a==='railgo'){S.pin=t.dataset.id;location.hash='#/guide/'+t.dataset.t;return;}
    if(a==='fglog'){var T0=TOPICS[t.dataset.t],it0=T0.items.filter(function(x){return x[0]===t.dataset.name;})[0];
      await api.addSighting({category:T0.cat,species:it0[0],emoji:it0[1],count:1,note:'',place:'',lat:null,lng:null});
      S.just=it0[0];S.sights=await syncSights();return render();}
    if(a==='fgopen'){var T1=TOPICS[t.dataset.t],pr=null;
      if(T1.hasMap){pr=spRows(t.dataset.t).filter(function(r){return r.species===t.dataset.name&&r.lat!=null;})[0];}
      if(pr){S.pin=pr.id;if(mapState.map)mapState.map.flyTo({center:[pr.lng,pr.lat],zoom:15});render();}
      return;}
    if(a==='pinit'){S.spot={name:t.dataset.name||''};location.hash='#/spot/'+t.dataset.t;return;}
    if(a==='maploc'){var q=await getPos();mapState.pos=q;if(mapState.map){mapState.map.flyTo({center:[q.lng,q.lat],zoom:15});refreshPins();}else render();return;}
    if(a==='mapdl'){return downloadMap();}
    if(a==='upos'){grabSpot();S.spot.pos=await getPos();return render();}
    if(a==='spotpost'){grabSpot();var tk=t.dataset.t,T2=TOPICS[tk],sp=S.spot,name=sp.name||T2.items[0][0],place=(sp.place||'').trim();
      var it2=T2.items.filter(function(x){return x[0]===name;})[0]; if(!it2)throw new Error('Pick one from the list.');
      var pos=(T2.locatable&&T2.hasMap&&sp.pos)?sp.pos:null;
      if(!place&&!pos)throw new Error(T2.hasMap?'Add a place or use your location.':'Add where you saw it.');
      await api.addSighting({category:T2.cat,species:it2[0],emoji:it2[1],count:1,note:(sp.note||'').trim(),place:place,lat:pos?r3(pos.lat):null,lng:pos?r3(pos.lng):null});
      S.spot={};S.sights=await syncSights();flash('ok','Posted.');location.hash='#/guide/'+tk;return;}
    if(a==='closereq'){await api.closeRequest(t.dataset.id);location.hash='#/';return;}
    if(a==='paid'){await api.setBooking(t.dataset.id,{requester_paid:true});return refresh();}
    if(a==='received'){await api.setBooking(t.dataset.id,{helper_received:true});return refresh();}
    if(a==='complete'){await api.setBooking(t.dataset.id,{status:'completed'});S.stars=0;return refresh();}
    if(a==='star'){S.stars=parseInt(t.dataset.n,10);return render();}
    if(a==='review'){if(!S.stars)throw new Error('Tap a star rating first.');await api.review(t.dataset.id,t.dataset.helper,S.stars,($('#rv-'+t.dataset.id).value||'').trim());S.stars=0;flash('ok','Thanks — review sent.');return refresh();}
    if(a==='addservice'){var tp=$('#stopic').value.trim();if(!tp)throw new Error('Choose or type a topic.');await api.saveService({topic:tp,price_cents:dollars('#sprice'),note:$('#snote').value.trim()});flash('ok','Saved. You\'ll be matched when someone needs '+tp+'.');return refresh();}
    if(a==='delservice'){await api.deleteService(t.dataset.id);return refresh();}
  }catch(err){flash('err',err.message);if(t.disabled)t.disabled=false;render();}
});
(async function boot(){
  api=DEMO?makeDemoApi():makeSupabaseApi();
  api.onAuth(function(){start();});
  await start();
  setInterval(function(){if(api.live)window.softRefresh();},20000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)window.softRefresh();});
})();

</script>
