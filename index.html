<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Give a Hand — Concordia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20303D;
    --paper:#EEF0EA;
    --card:#FFFFFF;
    --coral:#E2613B;
    --coral-light:#FBE4DC;
    --mustard:#D9A441;
    --mustard-light:#F8EBD2;
    --sage:#6E8C6B;
    --sage-light:#E3EBE0;
    --text:#2B2B28;
    --muted:#6B6B63;
    --border:#DEDCD0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:'Inter',sans-serif;
  }
  .appbar{
    background:var(--card);
    border-bottom:1px solid var(--border);
  }
  .appbar-inner{
    max-width:920px;
    margin:0 auto;
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logo{
    font-family:'Fraunces',serif;
    font-size:18px;
    font-weight:600;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .logo .mark{
    width:26px;height:26px;border-radius:8px;
    background:var(--coral);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;
  }
  .appbar-right{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .icon-btn{
    background:none;
    border:none;
    font-size:17px;
    color:var(--muted);
    cursor:pointer;
    position:relative;
  }
  .icon-btn .badge{
    position:absolute;
    top:-3px;right:-5px;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--coral);
    border:1.5px solid var(--card);
  }
  .icon-btn .badge.pulse{width:10px;height:10px;background:#E5322D}
  @keyframes badgePulse{0%{box-shadow:0 0 0 0 rgba(229,50,45,.55)}70%{box-shadow:0 0 0 8px rgba(229,50,45,0)}100%{box-shadow:0 0 0 0 rgba(229,50,45,0)}}
  .notif-panel{position:absolute;top:100%;right:-50px;margin-top:12px;width:330px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 30px rgba(32,48,61,.18);z-index:60;max-height:70vh;overflow:auto}
  .notif-head{font-weight:600;font-size:13px;padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:1}
  .notif-item.unread{background:rgba(229,50,45,.05);box-shadow:inset 3px 0 0 #E5322D}
  .notif-actions{display:flex;gap:14px}
  .notif-item{position:relative}
  .notif-x{position:absolute;top:8px;right:10px;width:24px;height:24px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:12px;cursor:pointer;opacity:.55}
  .notif-item:hover .notif-x,.notif-x:focus{opacity:1;background:var(--paper)}
  .notif-text{padding-right:22px}
  .notif-time{color:var(--muted);font-size:12px;font-weight:400;margin-left:4px;white-space:nowrap}
  .notif-state{font-size:12.5px;color:var(--muted)}
  .notif-state.accepted{color:#3E5A3B;font-weight:600}
  .notif-foot{padding:10px 16px;text-align:center;color:var(--muted);font-size:11.5px;border-top:1px solid var(--border)}
  .notif-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
  .notif-item:last-child{border-bottom:0}
  .notif-main{flex:1;min-width:0}
  .notif-text{font-size:14px;margin-bottom:8px;line-height:1.35}
  .notif-main input{width:100%;margin-bottom:8px}
  .notif-empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:13px}
  .profile-chip{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
  }
  .profile-chip .avatar-big{
    width:32px;height:32px;border-radius:50%;
    background:var(--mustard-light);
    color:#7A5A18;
    font-size:12px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--card);
    box-shadow:0 0 0 1.5px var(--border);
  }
  .profile-chip .pname{
    font-size:13px;
    font-weight:500;
    color:var(--ink);
  }
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:24px 24px 80px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:28px;
  }
  .place{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Fraunces',serif;
    font-size:20px;
    font-weight:600;
    color:var(--ink);
  }
  .place span.sub{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:400;
    color:var(--muted);
    margin-left:4px;
  }
  .tabs{
    display:flex;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:999px;
    padding:4px;
    gap:4px;
  }
  .tab-btn{
    border:none;
    background:transparent;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:500;
    padding:8px 18px;
    border-radius:999px;
    cursor:pointer;
    color:var(--muted);
    transition:background .15s ease, color .15s ease;
  }
  .tab-btn.active{
    background:var(--ink);
    color:#fff;
  }
  .meet-strip{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding:8px 12px;border-radius:12px;border:1px solid var(--border);background:var(--card);margin:0 0 12px;font-size:13px;color:var(--ink)}
  .meet-strip.approved{background:#EEF8F1;border-color:#BFE3CB}
  .meet-strip.pending{background:#FFF8E8;border-color:#F0DDA8}
  .meet-text{min-width:0;flex:1 1 200px}
  .meet-actions{display:flex;align-items:center;gap:6px;flex:none}
  .join-banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translate(-50%,-10px);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:90;display:flex;align-items:center;gap:12px;background:var(--card);color:var(--ink);border:1px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:14px;padding:10px 12px;width:max-content;max-width:min(92vw,440px);font-size:14px}
  .join-banner.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .jb-actions{display:flex;align-items:center;gap:6px;flex:none}
  .jb-x{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 6px}
  .hdr-logo{flex:none;display:flex;margin-right:8px}
  .hdr-logo img{width:30px;height:30px;border-radius:8px;display:block}
  .hdr-place{font-size:16px;text-decoration:none;min-width:0;flex:0 1 auto;margin-right:12px}
  .hdr-place span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hdr-tabs{background:none;border:0;border-radius:0;padding:0;gap:4px}
  .hdr-tabs .tab-btn{font-size:14px;padding:6px 12px;border-radius:0;background:none;border-bottom:2px solid transparent}
  .hdr-tabs .tab-btn.active{background:none;color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
  @media(max-width:640px){.hdr-place{max-width:34%;margin-right:6px;font-size:14px}.hdr-logo{margin-right:6px}.hdr-logo img{width:26px;height:26px}.hdr-tabs .tab-btn{padding:6px 7px;font-size:12.5px}.appbar-inner .pname{display:none}}
  .tab-desc{
    font-size:13px;
    color:var(--muted);
    margin:0 0 22px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--coral);
    display:inline-block;
  }

  section{display:none;}
  section.active{display:block;}

  .rail-label{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .rail{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:30px;
  }
  .rail::-webkit-scrollbar{height:6px;}
  .rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    flex:0 0 220px;
    display:flex;
    flex-direction:column;
  }
  .card.wide{
    flex:1 1 auto;
    width:100%;
  }
  .grid.two-rows{grid-template-rows:auto auto;grid-auto-rows:0;row-gap:0;overflow:hidden;margin-bottom:22px}
  .grid.two-rows>*{margin-bottom:16px}
  /* compact cards for the home "For you" (Roblox-style): small thumbnail, one-line titles with ... */
  .grid.two-rows{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));column-gap:12px}
  .grid.two-rows>*{margin-bottom:12px}
  .grid.two-rows .card{border-radius:12px}
  .grid.two-rows .thumb{aspect-ratio:16/9}
  .grid.two-rows .pin{top:6px;left:6px;font-size:9px;padding:2px 6px}
  .grid.two-rows .card-body{padding:8px 10px 10px;gap:4px}
  .grid.two-rows .tag{font-size:10px;padding:2px 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grid.two-rows .axis-dot{display:none}
  .grid.two-rows .title{font-size:12.5px;line-height:1.3;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grid.two-rows .meta{font-size:10.5px;gap:6px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
  .grid.two-rows .meta span:nth-child(n+2){overflow:hidden;text-overflow:ellipsis}
  #r-req .card{border-radius:12px}
  #r-req .thumb{aspect-ratio:16/9}
  #r-req .pin{top:6px;left:6px;font-size:9px;padding:2px 6px}
  #r-req .card-body{padding:8px 10px 10px;gap:4px}
  #r-req .tag{font-size:10px;padding:2px 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #r-req .axis-dot{display:none}
  #r-req .title{font-size:12.5px;line-height:1.3;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #r-req .meta{font-size:10.5px;gap:6px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
  #r-req .meta span:nth-child(n+2){overflow:hidden;text-overflow:ellipsis}
  #r-req .card{margin:0;min-width:0}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:16px;
  }
  .thumb{
    position:relative;
    aspect-ratio:16/10;
    width:100%;
    overflow:hidden;
    background:var(--sage-light);
  }
  .thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .pin{
    position:absolute;
    top:10px;
    left:10px;
    background:var(--ink);
    color:#fff;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:500;
    padding:4px 8px;
    border-radius:999px;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .pin.high{background:var(--coral);}
  .creator-flag{
    position:absolute;
    top:10px;
    right:10px;
    background:var(--sage);
    color:#fff;
    font-size:10px;
    font-weight:500;
    padding:4px 8px;
    border-radius:999px;
  }
  .card-body{
    padding:12px 14px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
  }
  .tag{
    align-self:flex-start;
    font-size:11px;
    font-weight:500;
    padding:3px 9px;
    border-radius:6px;
  }
  .tag.wildlife{background:var(--sage-light);color:#3E5A3B;}
  .tag.lost{background:#E1EEF7;color:#1F5B82;}
  .tag.tenant{background:#FBE3E3;color:#9B2C2C;}
  .tag.art{background:#F1E6F7;color:#6A3D85;}
  .tag.general{background:#F0F0EC;color:var(--muted);}
  .tag.civic{background:#FDEBD2;color:#8A5A1E;}
  .tag.building{background:#E3E0F0;color:#4B3D8A;}
  .axis-dot{
    font-size:10px;
    color:var(--muted);
    margin-left:6px;
    font-weight:500;
  }
  .connect-prompt{
    margin:14px 0 0 38px;
    background:var(--sage-light);
    border:1px solid var(--sage);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    max-width:420px;
  }
  .connect-text{font-size:12.5px;color:#3E5A3B;line-height:1.4;flex:1;}
  .connect-btn{
    background:var(--sage);color:#fff;
    font-size:12px;font-weight:500;
    padding:7px 14px;border-radius:8px;
    border:none;cursor:pointer;white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .connect-btn.sent{background:#fff;color:var(--sage);border:1px solid var(--sage);}
  .pin.cluster{background:#8A5A1E;}
  .guide-badge{
    display:inline-flex;align-items:center;gap:4px;
    background:var(--mustard-light);color:#8A5A1E;
    font-size:10px;font-weight:600;
    padding:2px 8px;border-radius:999px;
    margin-left:6px;
  }
  .comment{
    border-top:1px solid var(--border);
    padding:14px 0;
  }
  .comment-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .comment-avatar{
    width:30px;height:30px;border-radius:50%;
    background:var(--sage);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;flex:none;
  }
  .comment-name{font-weight:600;font-size:13px;}
  .comment-time{font-size:11px;color:var(--muted);}
  .comment-text{font-size:13px;line-height:1.5;margin:0 0 10px 38px;}
  .product-card{
    margin-left:38px;
    display:flex;gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    align-items:center;
    max-width:380px;
  }
  .product-card img{
    width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;
  }
  .product-name{font-weight:600;font-size:13px;}
  .product-meta{font-size:11px;color:var(--muted);margin-top:2px;}
  .product-cta{
    margin-left:auto;
    background:var(--ink);color:#fff;
    font-size:11px;font-weight:500;
    padding:6px 10px;border-radius:8px;
    white-space:nowrap;
  }
  .helpful-btn{
    margin:8px 0 0 38px;
    display:inline-flex;align-items:center;gap:6px;
    background:none;
    border:1px solid var(--border);
    border-radius:999px;
    padding:5px 12px;
    font-size:12px;font-weight:500;
    color:var(--muted);
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .helpful-btn:hover{border-color:var(--sage);color:var(--sage);}
  .helpful-btn.marked{background:var(--sage-light);color:#3E5A3B;border-color:var(--sage);}
  .helpful-count{font-weight:600;}
  .tag.labor{background:#DCEAE6;color:#1F6E54;}
  .pin.request{background:#1F6E54;}
  .offer-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    display:flex;
    gap:12px;
  }
  .offer-avatar{
    width:42px;height:42px;border-radius:50%;
    background:#1F6E54;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:600;flex:none;
  }
  .offer-body{flex:1;}
  .offer-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .offer-name{font-weight:600;font-size:13px;}
  .first-job-badge{
    font-size:10px;font-weight:600;color:#8A5A1E;
    background:var(--mustard-light);
    padding:2px 8px;border-radius:999px;
  }
  .trusted-badge{
    font-size:10px;font-weight:600;color:#1F6E54;
    background:#DCEAE6;
    padding:2px 8px;border-radius:999px;
  }
  .business-badge{
    font-size:10px;font-weight:600;color:#20303D;
    background:#DCE3EA;
    padding:2px 8px;border-radius:999px;
  }

  .referral-card{
    border:1px solid var(--sage);background:var(--sage-light);border-radius:14px;
    padding:14px 16px;
  }
  .referral-card.locked{border:1px dashed var(--border);background:var(--paper);}
  .referral-title{font-size:13px;font-weight:600;color:#3E5A3B;}
  .referral-card.locked .referral-title{color:var(--muted);}
  .referral-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;}
  .referral-btn{
    margin-top:10px;font-size:12px;font-weight:600;border-radius:8px;padding:7px 12px;
    border:1px solid var(--sage);background:#fff;color:#3E5A3B;cursor:pointer;
  }
  .referral-btn:hover{background:var(--sage);color:#fff;}
  .referral-btn.pending{color:var(--muted);cursor:default;}
  .referral-btn.paid{background:var(--ink);border-color:var(--ink);color:#fff;cursor:default;}
  .offer-rate{font-size:12px;color:var(--muted);margin-top:2px;}
  .offer-text{font-size:13px;line-height:1.5;margin:8px 0 10px;}
  .offer-actions{display:flex;gap:8px;}
  .offer-msg-btn{
    background:var(--ink);color:#fff;
    font-size:12px;font-weight:500;
    padding:7px 14px;border-radius:8px;
    border:none;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .offer-mutual{font-size:11px;color:var(--muted);}

  .team-suggest{
    background:var(--coral-light);
    border:1px solid var(--coral);
    border-radius:12px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .team-suggest .duo-avatars{display:flex;flex:none;}
  .team-suggest .duo-avatars .mini-avatar{
    width:30px;height:30px;border-radius:50%;
    background:#993C1D;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;
    border:2px solid var(--coral-light);
  }
  .team-suggest .duo-avatars .mini-avatar:last-child{margin-left:-10px;}
  .team-suggest .team-text{flex:1;font-size:12.5px;color:#712B13;line-height:1.4;}
  .team-suggest .team-text b{font-weight:600;}
  .team-btn{
    background:var(--coral);color:#fff;
    font-size:12px;font-weight:500;
    padding:7px 14px;border-radius:8px;
    border:none;cursor:pointer;white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .team-btn.sent{background:#fff;color:var(--coral);border:1px solid var(--coral);}

  .bridge-prompt{
    background:var(--mustard-light);
    border:1px solid var(--mustard);
    border-radius:12px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .bridge-prompt .duo-avatars{display:flex;flex:none;}
  .bridge-prompt .duo-avatars .mini-avatar{
    width:30px;height:30px;border-radius:50%;
    background:#8A5A1E;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;
    border:2px solid var(--mustard-light);
  }
  .bridge-prompt .duo-avatars .mini-avatar:last-child{margin-left:-10px;}
  .bridge-prompt .bridge-text{flex:1;font-size:12.5px;color:#7A5A18;line-height:1.4;}
  .bridge-prompt .bridge-text b{font-weight:600;}
  .bridge-btn{
    background:var(--mustard);color:#fff;
    font-size:12px;font-weight:500;
    padding:7px 14px;border-radius:8px;
    border:none;cursor:pointer;white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .bridge-btn.sent{background:#fff;color:var(--mustard);border:1px solid var(--mustard);}

  .resurface-banner{
    background:var(--sage-light);
    border:1px solid var(--sage);
    border-radius:12px;
    padding:14px;
    margin:18px 0;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .resurface-banner .mini-avatar{
    width:34px;height:34px;border-radius:50%;
    background:var(--sage);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;flex:none;
  }
  .resurface-banner .resurface-text{flex:1;font-size:12.5px;color:#3E5A3B;line-height:1.4;}

/* ---- phase 1 additions (everything else is the phase 5 stylesheet, unchanged) ---- */
.brand{font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:var(--ink);text-decoration:none}
.note{border-radius:10px;padding:10px 14px;font-size:13px;margin:0 0 14px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ============ CONFIG — paste your Supabase values (see SETUP.md). Leave empty for demo mode. ============ */
var SUPABASE_URL = "";
var SUPABASE_ANON_KEY = "";
var SPACE_SLUG = "concordia";           // phase 5: a neighbourhood space, e.g. "plateau"
/* ==========================================================================================
   PHASE FLAGS — this is the same app as phase 5, with most lanes switched off.
   To move to the next phase you flip flags and add the matching modules; nothing is rebuilt.
   ========================================================================================== */
var FEATURES = {
  helpLane:true,        // phase 1 — "🤝 Looking for help" posts + offers + sessions + reviews
  connections:false,    // phase 2 — Connections row ("online now"), neighbour profiles, mutual connections
  topicHubs:false,      // phase 3 — Topic hubs: field guide / growth plots / creations (wildlife, art, garden…)
  maps:false,           // phase 4 — Map + location (permission based, spaces get coordinates)
  forYouRanking:false   // phase 5 — full three-lane "For you" (popular + matches + test exposure)
};
var DEMO = !SUPABASE_URL || !SUPABASE_ANON_KEY || (location.search.indexOf('demo=1') > -1);

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(c){return '$'+(c/100).toFixed(c%100===0?0:2);}
function initials(n){return (n||'?').split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
function first(n){return (n||'').split(/\s+/)[0];}
function ago(iso){var s=(Date.now()-new Date(iso).getTime())/1000; if(s<3600)return Math.max(1,Math.round(s/60))+'m'; if(s<86400)return Math.round(s/3600)+'h'; return Math.round(s/86400)+'d';}
function agoLong(iso){var a=ago(iso),n=parseInt(a,10); return a.slice(-1)==='m'?n+' min ago':a.slice(-1)==='h'?n+'h ago':n+(n===1?' day ago':' days ago');}
function hash(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
var GRAD=[['#E3EBE0','#C9DCC4'],['#F8EBD2','#EBCF9A'],['#DCEAE6','#B4D3C9'],['#FBE4DC','#F0BBA8'],['#E5E3F2','#BDB8DF'],['#E4EDF4','#B5CDE0']];
function thumbStyle(topic){var g=GRAD[hash(topic)%GRAD.length];return 'background:linear-gradient(135deg,'+g[0]+','+g[1]+')';}
function thumbHtml(r,pin,pinCls){
  return '<div class="thumb">'+(r.image?'<img src="'+r.image+'" alt="">':'<div class="topic-fill" style="'+thumbStyle(r.topic)+'"><span>'+esc(r.topic)+'</span></div>')+
    (pin?'<span class="pin '+(pinCls||'request')+'">'+esc(pin)+'</span>':'')+'</div>';
}
function stars(avg,n){if(!n)return '<span class="muted-s">New helper</span>';var r=Math.round(avg);return '<span class="stars">'+'★'.repeat(r)+'☆'.repeat(5-r)+'</span> <span class="muted-s">'+avg.toFixed(1)+' ('+n+')</span>';}

/* ===================== DATA LAYER =====================
   The UI only talks to `api`. Two implementations: Supabase (live) and a localStorage demo. */
var api;
function makeSupabaseApi(){
  var sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY), spaceId=null, uid=null;
  function chk(r){ if(r.error) throw new Error(r.error.message); return r.data; }

/* ===================== MATCHING (auto — nobody matches by hand) =====================
   Budget fit first, then rating (with a prior so one 5★ doesn't beat ten 4.8s), then price. */
function rankHelpers(list,budget){
  list.forEach(function(h){h.score=(h.sum+4*2)/(h.n+2);h.avg=h.n?h.sum/h.n:0;h.fits=h.price_cents<=budget;});
  return list.sort(function(a,b){if(a.fits!==b.fits)return a.fits?-1:1;if(b.score!==a.score)return b.score-a.score;return a.price_cents-b.price_cents;});
}

/* ---- map file saved once in the browser (IndexedDB) ---- */
function idb(){return new Promise(function(res,rej){var q=indexedDB.open('giveahand',1);q.onupgradeneeded=function(){q.result.createObjectStore('maps');};q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});}
async function idbGet(k){var db=await idb();return new Promise(function(res,rej){var t=db.transaction('maps').objectStore('maps').get(k);t.onsuccess=function(){res(t.result||null);};t.onerror=function(){rej(t.error);};});}
async function idbSet(k,v){var db=await idb();return new Promise(function(res,rej){var t=db.transaction('maps','readwrite');t.objectStore('maps').put(v,k);t.oncomplete=function(){res();};t.onerror=function(){rej(t.error);};});}
function loadLib(){ if(mapState.libP) return mapState.libP;
  mapState.libP=new Promise(function(res,rej){var l=document.createElement('link');l.rel='stylesheet';l.href='https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css';document.head.appendChild(l);
    function sc(src,cb){var e=document.createElement('script');e.src=src;e.onload=cb;e.onerror=function(){rej(new Error('Map library failed to load'));};document.head.appendChild(e);}
    sc('https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js',function(){sc('https://cdn.jsdelivr.net/npm/pmtiles@3.2.1/dist/pmtiles.js',function(){mapState.proto=new pmtiles.Protocol();maplibregl.addProtocol('pmtiles',mapState.proto.tile);res();});});});
  return mapState.libP;}
function mapStyle(file){
  var L=[{id:'bg',type:'background',paint:{'background-color':'#EEF0EA'}}],src={};
  if(file){src.pm={type:'vector',url:'pmtiles://'+file.name,attribution:'© OpenStreetMap contributors'};
    L.push({id:'earth',type:'fill',source:'pm','source-layer':'earth',paint:{'fill-color':'#E9EBE0'}},
      {id:'natural',type:'fill',source:'pm','source-layer':'natural',paint:{'fill-color':'#D6E3C8'}},
      {id:'park',type:'fill',source:'pm','source-layer':'landuse',filter:['==',['get','kind'],'park'],paint:{'fill-color':'#D6E3C8'}},
      {id:'water',type:'fill',source:'pm','source-layer':'water',paint:{'fill-color':'#BFD7E6'}},
      {id:'bldg',type:'fill',source:'pm','source-layer':'buildings',minzoom:14,paint:{'fill-color':'#DAD7CC'}},
      {id:'roads',type:'line',source:'pm','source-layer':'roads',paint:{'line-color':'#FFFFFF','line-width':['interpolate',['linear'],['zoom'],10,0.4,16,4]}});}
  return {version:8,sources:src,layers:L};}
function overlayHtml(){ if(!MAP_URL||mapState.failed||!mapState.dlErr||mapState.saved)return '';
  return '<div class="sp-ov"><b>Couldn\'t save the map for offline use</b><span class="hint" style="margin:0;color:#b3261e">'+esc(mapState.dlErr)+' ('+esc(MAP_URL)+')</span><button class="post-btn sm" data-act="mapdl">Try again</button></div>';}
async function mountMap(){
  var slot=document.getElementById('sp-map-slot'); if(!slot||mapState.failed)return;
  if(!mapState.holder){mapState.holder=document.createElement('div');mapState.holder.style.cssText='position:absolute;inset:0';}
  slot.appendChild(mapState.holder);
  if(mapState.map){mapState.map.resize();return refreshPins();}
  if(mapState.busy)return; mapState.busy=true;
  try{ await loadLib(); var file=null;
    if(MAP_URL){ var rec=null; try{rec=await idbGet('montreal');}catch(e){}
      if(rec&&rec.v===MAP_VERSION){ file=new File([rec.blob],'montreal.pmtiles'); mapState.saved=true; } else prepMap(); }
    var abs=MAP_URL?new URL(MAP_URL,location.href).href:'';
    if(file) mapState.proto.add(new pmtiles.PMTiles(new pmtiles.FileSource(file)));
    else if(abs){ file={name:abs}; mapState.proto.add(new pmtiles.PMTiles(abs)); }  /* no saved copy yet: stream only the tiles on screen, so the map shows right away */
    mapState.map=new maplibregl.Map({container:mapState.holder,style:mapStyle(file),center:[-73.5673,45.5017],zoom:11,minZoom:9,maxZoom:16,maxBounds:[[-74.1,45.3],[-73.3,45.8]],attributionControl:{compact:true}});

function refreshPins(){ var m=mapState.map; if(!m||!window.maplibregl)return;
  mapState.markers.forEach(function(k){k.remove();}); mapState.markers=[]; if(mapState.you){mapState.you.remove();mapState.you=null;}

function drawTrailLine(m,tr){
  var go=function(){ var data={type:'Feature',geometry:{type:'LineString',coordinates:tr?tr.line:[]}};
    if(m.getSource('trail')){m.getSource('trail').setData(data);return;}
    m.addSource('trail',{type:'geojson',data:data});
    m.addLayer({id:'trail-case',type:'line',source:'trail',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#fff','line-width':8}});
    m.addLayer({id:'trail-line',type:'line',source:'trail',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#3E5A3B','line-width':4,'line-dasharray':[2,1.4]}}); };
  if(m.isStyleLoaded())go(); else m.once('load',go);}
/* Runs when the app opens (not when the map page opens): loads the map library and, if this phone has no saved copy of the map, downloads it quietly in the background. */
function prepMap(){
  if(!MAP_URL||mapState.prep)return; mapState.prep=true;
  loadLib().catch(function(){});
  (async function(){
    var rec=null; try{rec=await idbGet('montreal');}catch(e){}
    if(rec&&rec.v===MAP_VERSION){mapState.saved=true;return;}
    var had=false;try{had=!!localStorage.getItem('gah_map_dl');}catch(e){}
    api.logMap('no_saved_map',rec?'old_version':(had?'evicted':'none'));
    downloadMap();
  })();}
async function downloadMap(){
  if(mapState.dlP&&!mapState.dlErr)return mapState.dlP; mapState.dlErr=''; render();
  mapState.dlP=(async function(){
    try{ var r=await fetch(MAP_URL,{cache:'no-cache'}); if(!r.ok)throw new Error('Map download failed ('+r.status+')');
      var blob=await r.blob();
      try{ await idbSet('montreal',{v:MAP_VERSION,blob:blob}); localStorage.setItem('gah_map_dl','1'); if(navigator.storage&&navigator.storage.persist)navigator.storage.persist(); }catch(e){}
      api.logMap('downloaded','',blob.size); mapState.saved=true;   /* the map on screen keeps streaming; next visit opens from this saved copy */
    }catch(e){ mapState.dlErr=e.message; }
    render();
  })(); return mapState.dlP;}

      flash('ok','Request posted — your best matches are below.');location.hash='#/post/'+r.id;return;}
    if(a==='ask'){await api.ask(t.dataset.req,t.dataset.helper,parseInt(t.dataset.price,10));flash('ok','Request sent. We\'ll show the next best match if they decline.');return refresh();}
    if(a==='offer'){var price=dollars('#oprice');await api.offer(t.dataset.req,t.dataset.to,price,($('#onote').value||'').trim());flash('ok','Offer sent.');return refresh();}
    if(a==='accept'){await api.setBooking(t.dataset.id,{status:'accepted'},t.dataset.req);flash('ok','Accepted — their contact is shown below.');return refresh();}
    if(a==='decline'){S.cc=null;await api.setBooking(t.dataset.id,{status:'declined'},t.dataset.req,t.dataset.reopen==='1');flash('ok',t.dataset.reopen==='1'?'Cancelled. Contact hidden, request reopened.':'Done.');return refresh();}
    if(a==='rnav'){var rel=document.getElementById(t.dataset.r);if(rel)rel.scrollBy({left:parseInt(t.dataset.dir,10)*railStep(rel),behavior:'smooth'});return;}
    if(a==='nkind'){S.newKind=t.dataset.k;return render();}
    if(a==='postoffer'){var ot=($('#otopic').value||'').trim();if(!ot)throw new Error('Choose or type a topic.');await api.saveService({topic:ot,price_cents:dollars('#oprice2'),note:($('#onote2').value||'').trim()});S.services=await api.myServices();S.ptab='posts';S.newKind='need';flash('ok','Posted. You\'ll be matched when someone needs '+ot+'.');location.hash='#/me';return;}
    if(a==='jbreview'){hideJoinBanner();S.notifOpen=true;appbar();window.scrollTo({top:0,behavior:'smooth'});return;}
    if(a==='jbx'){hideJoinBanner();return;}
    if(a==='bell'){if(S.notifOpen)return closeNotif();S.notifOpen=true;return appbar();}
    if(a==='ndismiss'){var dx=notifItems().filter(function(x){return x.id===t.dataset.id;});if(dx.length)dismissNotifs(dx);return;}
    if(a==='nclear'){dismissNotifs(notifItems().filter(canDismiss));return;}
    if(a==='nread'){S.notifs.forEach(function(x){x.read=true;});try{await api.markNotifsRead();}catch(e){}return appbar();}
    if(a==='nappr'){var npl=(($('#nplace-'+t.dataset.id)||{}).value||'').trim();if(!npl)throw new Error('Say where you would meet.');await api.setConn(t.dataset.id,{status:'approved',place:npl});flash('ok','Accepted. They can now see the place.');return refresh();}
    if(a==='cnav'){var el=document.getElementById('conn-rail');if(el)el.scrollBy({left:parseInt(t.dataset.dir,10)*Math.max(1,Math.floor((el.clientWidth+CONN_GAP)/CONN_STEP))*CONN_STEP,behavior:'smooth'});return;}
    if(a==='sedit'){S.editStatus=!S.editStatus;S.emojiOpen=false;S.draftEmoji=S.draftText=S.draftTags=null;return render();}
    if(a==='sttag'){readStatusDraft();var tl=curTags().slice(),ti=tl.indexOf(t.dataset.t);if(ti>-1)tl.splice(ti,1);else if(tl.length<8)tl.push(t.dataset.t);S.draftTags=tl;return render();}
    if(a==='epick'||a==='eset'){readStatusDraft();if(a==='eset'){S.draftEmoji=t.dataset.e;S.emojiOpen=false;}else S.emojiOpen=!S.emojiOpen;return render();}
    if(a==='ssave'){var tx=($('#stext').value||'').trim(),em=(curEmoji()||'').trim();
      if(!tx&&!em)throw new Error('Add an emoji or a few words first.');
      var stg=parseTags(($('#sttags')||{}).value);await api.setStatus(em,tx,true,stg);S.draftEmoji=S.draftText=S.draftTags=null;S.emojiOpen=false;S.editStatus=false;return refresh();}
    if(a==='sclear'){await api.setStatus('','',false,[]);S.draftEmoji=S.draftText=S.draftTags=null;S.emojiOpen=false;S.editStatus=false;return refresh();}
    if(a==='connect'){await api.connect(t.dataset.to);flash('ok','Request sent.');return refresh();}
    if(a==='cappr'){var pl=($('#place-'+t.dataset.id).value||'').trim();if(!pl)throw new Error('Say where you would meet.');await api.setConn(t.dataset.id,{status:'approved',place:pl});flash('ok','Approved. They can now see the place.');return refresh();}
    if(a==='cdecl'){await api.setConn(t.dataset.id,{status:'declined'});return refresh();}
    if(a==='cask'){S.cc=t.dataset.id;return render();}
    if(a==='ckeep'){S.cc=null;return render();}
    if(a==='ccancel'){S.cc=null;await api.cancelConn(t.dataset.id);flash('ok','Cancelled.');return refresh();}
    if(a==='pinsel'){S.spNote='';S.pin=t.dataset.id;return render();}
    if(a==='tagadd'){var ti=document.getElementById('tagnew');followTag(normTag(ti&&ti.value));return render();}
    if(a==='tagpick'){followTag(normTag(t.dataset.t));return render();}
    if(a==='interest'){var k=t.dataset.t;if(COMMON_TAGS.indexOf(k)>-1)return;var i=S.interests.indexOf(k);if(i>-1)S.interests.splice(i,1);else S.interests.push(k);saveInterests();syncTag(k,i<0);return render();}
    if(a==='guide'){S.guideOpen=true;return render();}
    if(a==='guideclose'){S.guideOpen=false;return render();}
    if(a==='tstop'){S.tstop=+t.dataset.i; var tt=trailBy(route().id),sx=tt&&tt.stops[S.tstop]; if(sx&&mapState.map)mapState.map.flyTo({center:sx.ll,zoom:16}); return render();}
    if(a==='tstopclear'){S.tstop=null;return render();}
    if(a==='pinclear'){S.pin=null;return render();}
    if(a==='spfilter'){ var nm=t.dataset.name; S.guideOpen=false; S.spFocus=nm||null; S.spNote='';
      if(nm){ var rows=spRows(curGuide).filter(function(r){return r.species===nm&&r.lat!=null;}).sort(function(x,y){return new Date(y.seen_at)-new Date(x.seen_at);});
        if(!rows.length){S.pin=null;S.spNote='No pin for '+nm+' yet';}
        else{ S.spCycle=S.spCycle||{}; var k=(S.spCycle[nm]==null?0:S.spCycle[nm]+1)%rows.length; S.spCycle[nm]=k; var pr=rows[k]; S.pin=pr.id;
          if(mapState.map)mapState.map.flyTo({center:[pr.lng,pr.lat],zoom:15}); if(rows.length>1)S.spNote=nm+' · '+(k+1)+' of '+rows.length+' — tap again for the next'; } }
      else S.pin=null;
      return render();}
    if(a==='railgo'){S.pin=t.dataset.id;location.hash='#/guide/'+t.dataset.t;return;}
    if(a==='fglog'){var T0=TOPICS[t.dataset.t],it0=T0.items.filter(function(x){return x[0]===t.dataset.name;})[0];
      await api.addSighting({category:T0.cat,species:it0[0],emoji:it0[1],count:1,note:'',place:'',lat:null,lng:null,tags:T0.tag?[T0.tag]:[]});
      S.just=it0[0];S.sights=await syncSights();return render();}
    if(a==='tlog'){var tt2=trailBy(t.dataset.id),sx2=tt2&&tt2.stops[+t.dataset.i]; if(!sx2||!sx2.sp)return;
      await api.addSighting({category:sx2.c||'bird',species:sx2.sp,emoji:sx2.e,count:1,note:'',place:tt2.name,lat:null,lng:null,tags:tt2.kind==='birds'?[]:[tt2.kind]});
      S.sights=await syncSights();return render();}
    if(a==='fgopen'){var T1=TOPICS[t.dataset.t],pr=null;
      if(T1.hasMap){pr=spRows(t.dataset.t).filter(function(r){return r.species===t.dataset.name&&r.lat!=null;})[0];}
      if(pr){S.pin=pr.id;if(mapState.map)mapState.map.flyTo({center:[pr.lng,pr.lat],zoom:15});render();}
      return;}
    if(a==='pinit'){S.spot={name:t.dataset.name||''};location.hash='#/spot/'+t.dataset.t;return;}
    if(a==='maploc'){var q=await getPos();mapState.pos=q;if(mapState.map){mapState.map.flyTo({center:[q.lng,q.lat],zoom:15});refreshPins();}else render();return;}
    if(a==='mapdl'){return downloadMap();}
    if(a==='upos'){grabSpot();S.spot.pos=await getPos();return render();}
    if(a==='spotpost'){grabSpot();var tk=t.dataset.t,T2=TOPICS[tk],sp=S.spot,name=sp.name||T2.items[0][0],place=(sp.place||'').trim();
      var nw=(sp.nw||'').trim(),it2=nw?[nw.slice(0,60),'🔖']:T2.items.filter(function(x){return x[0]===name;})[0]; if(!it2)throw new Error('Pick one from the list.'); if(it2[0]==='Something I spotted')throw new Error('Say what you spotted.');
      var pos=(T2.locatable&&T2.hasMap&&sp.pos)?sp.pos:null;
      if(!place&&!pos)throw new Error(T2.hasMap?'Add a place or use your location.':'Add where you saw it.');
      await api.addSighting({category:T2.cat,species:it2[0],emoji:it2[1],count:1,note:(sp.note||'').trim(),place:place,lat:pos?r3(pos.lat):null,lng:pos?r3(pos.lng):null,tags:parseTags(sp.tagsStr!=null?sp.tagsStr:(T2.tag||''))});
      S.spot={};S.sights=await syncSights();flash('ok','Posted.');location.hash='#/guide/'+tk;return;}
    if(a==='closereq'){await api.closeRequest(t.dataset.id);location.hash='#/';return;}
    if(a==='paid'){await api.setBooking(t.dataset.id,{requester_paid:true});return refresh();}
    if(a==='received'){await api.setBooking(t.dataset.id,{helper_received:true});return refresh();}
    if(a==='complete'){await api.setBooking(t.dataset.id,{status:'completed'});S.stars=0;return refresh();}
    if(a==='star'){S.stars=parseInt(t.dataset.n,10);return render();}
    if(a==='review'){if(!S.stars)throw new Error('Tap a star rating first.');await api.review(t.dataset.id,t.dataset.helper,S.stars,($('#rv-'+t.dataset.id).value||'').trim());S.stars=0;flash('ok','Thanks — review sent.');return refresh();}
    if(a==='addservice'){var tp=$('#stopic').value.trim();if(!tp)throw new Error('Choose or type a topic.');await api.saveService({topic:tp,price_cents:dollars('#sprice'),note:$('#snote').value.trim()});flash('ok','Saved. You\'ll be matched when someone needs '+tp+'.');return refresh();}
    if(a==='delservice'){await api.deleteService(t.dataset.id);if(t.dataset.back){S.services=await api.myServices();S.ptab='posts';location.hash='#/me';return;}return refresh();}
  }catch(err){flash('err',err.message);if(t.disabled)t.disabled=false;render();}
});
(async function boot(){
  api=DEMO?makeDemoApi():makeSupabaseApi();
  api.onAuth(function(){start();});
  await start();
  setInterval(function(){if(api.live)window.softRefresh();},20000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)window.softRefresh();});
})();

</script>
